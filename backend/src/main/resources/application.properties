spring.application.name=AppBarPOS
server.address=127.0.0.1
server.port=${APPBARPOS_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.sql.init.mode=never
spring.main.banner-mode=off
server.error.include-message=never
server.error.include-stacktrace=never
appbarpos.data-dir=${APPBARPOS_DATA_DIR:}
logging.file.name=${APPBARPOS_DATA_DIR:${LOCALAPPDATA:${user.home}}/BarSoftware}/logs/backend.log
debug=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=APPBARPOS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/api
server.servlet.session.tracking-modes=cookie
appbarpos.auth.max-attempts=5
appbarpos.auth.lock-seconds=60
appbarpos.api-token=${APPBARPOS_API_TOKEN:}
# No registrar el cuerpo de solicitudes con credenciales, incluso en diagnóstico.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core=INFO
